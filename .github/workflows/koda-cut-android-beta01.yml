name: Koda Cut Android Beta 0.3 Render

on:
  push:
    branches: [koda-cut-android-beta03-render]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Download bundled font pack
        shell: bash
        run: |
          mkdir -p android-kodacut-beta01/app/src/main/assets/fonts
          curl -L --fail -o android-kodacut-beta01/app/src/main/assets/fonts/Anton-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf"
          curl -L --fail -o android-kodacut-beta01/app/src/main/assets/fonts/BebasNeue-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/bebasneue/BebasNeue-Regular.ttf"
          curl -L --fail -o android-kodacut-beta01/app/src/main/assets/fonts/Montserrat.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf"
          curl -L --fail -o android-kodacut-beta01/app/src/main/assets/fonts/Poppins-SemiBold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-SemiBold.ttf"
          curl -L --fail -o android-kodacut-beta01/app/src/main/assets/fonts/Oswald.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/oswald/Oswald%5Bwght%5D.ttf"
          curl -L --fail -o android-kodacut-beta01/app/src/main/assets/fonts/Bangers-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/bangers/Bangers-Regular.ttf"

      - name: Build debug APK
        working-directory: android-kodacut-beta01
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KodaCut-Android-Beta03-Render
          path: android-kodacut-beta01/app/build/outputs/apk/debug/app-debug.apk
