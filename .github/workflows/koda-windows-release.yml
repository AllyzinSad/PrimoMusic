name: Koda Music Windows Release

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'core/**'
      - '.github/workflows/koda-windows-release.yml'

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, 'Koda Music 3.11.0')
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and verify portable
        shell: pwsh
        run: .\gradlew.bat :desktop:portableZip --stacktrace
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v3.11.0 release/KodaMusic-3.11.0-Portable.zip --clobber
          gh release edit v3.11.0 --notes "Koda Music para Windows: visual renovado, logo oficial, cartões de gênero distintos, tema preto e branco corrigido e melhor desempenho. Extraia o ZIP e abra KodaMusic.exe. Java e mpv já estão incluídos. Sem download ou modo offline na versão Windows. Código baseado no projeto de código aberto BitChord; créditos e licença GPLv3 acompanham o pacote e o código-fonte."
