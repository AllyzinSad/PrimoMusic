name: Android CI

on: [push, pull_request]

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-dev-debug:
    timeout-minutes: 30
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/koda-android-final-3110'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup local.properties
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Validate image resources
      run: python3 .github/scripts/check_android_pngs.py

    - name: Build Dev Debug APK
      run: ./gradlew -PincludeAndroid=true :app:assembleDevDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KodaMusic-Android-Debug
        path: app/build/outputs/apk/dev/debug/*.apk

  build-prod-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
        echo "storeFile=bitchord-release.jks" > keystore.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew -PincludeAndroid=true :app:assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KodaMusic-Android-Release-Signed
        path: app/build/outputs/apk/prod/release/*.apk

  build-final-unsigned:
    if: github.ref == 'refs/heads/koda-android-final-3110'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Set up properties
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
    - name: Validate image resources
      run: python3 .github/scripts/check_android_pngs.py
    - name: Build production release unsigned
      run: |
        chmod +x gradlew
        ./gradlew -PincludeAndroid=true :app:assembleProdRelease
    - name: Align APK for signing
      run: |
        mkdir -p dist
        "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -f -p 4 app/build/outputs/apk/prod/release/app-prod-universal-release-unsigned.apk dist/KodaMusic-3.11.0-universal-aligned-unsigned.apk
        cp "${ANDROID_HOME}/build-tools/36.0.0/lib/apksigner.jar" dist/
    - uses: actions/upload-artifact@v4
      with:
        name: KodaMusic-Android-Final-Unsigned
        path: dist/
