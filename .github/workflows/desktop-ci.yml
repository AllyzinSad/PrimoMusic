name: Desktop CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - 'core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
  push:
    branches: [ primo-3.11.0-redesign ]
    paths:
      - 'desktop/**'
      - 'core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: read

jobs:
  compile-desktop:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Compile Koda Music Desktop
        shell: pwsh
        run: .\gradlew.bat :desktop:compileKotlin --stacktrace

      - name: Build verified portable test package
        shell: pwsh
        run: .\gradlew.bat :desktop:portableZip --stacktrace

      - name: Upload portable test package
        uses: actions/upload-artifact@v4
        with:
          name: KodaMusic-3.11.0-Portable
          path: release/KodaMusic-3.11.0-Portable.zip
          if-no-files-found: error
