name: Koda Windows 3.11 Source Package

on:
  workflow_dispatch:
  push:
    branches:
      - koda-windows-3.11-handoff
    paths:
      - .github/workflows/koda-windows-311-source.yml

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Windows 3.11 source
        uses: actions/checkout@v4
        with:
          ref: f54397646de4fe87e8224baf698fa4d85a65d789
          fetch-depth: 1

      - name: Package source ZIP
        run: |
          rm -rf .git
          zip -qr KodaMusic-Windows-3.11.0-Source.zip . \
            -x "KodaMusic-Windows-3.11.0-Source.zip" \
            -x ".gradle/*" \
            -x "**/build/*" \
            -x "local.properties"

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: KodaMusic-Windows-3.11.0-Source
          path: KodaMusic-Windows-3.11.0-Source.zip
          if-no-files-found: error
