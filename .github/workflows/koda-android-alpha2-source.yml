name: Koda Android Alpha2 Source Package

on:
  workflow_dispatch:
  push:
    branches:
      - koda-android-alpha2
    paths:
      - .github/workflows/koda-android-alpha2-source.yml

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Alpha 2 source
        uses: actions/checkout@v4
        with:
          ref: d6c3b35f86a49e49a9486a28e832573467000865
          fetch-depth: 1

      - name: Package source ZIP
        run: |
          rm -rf .git
          zip -qr KodaMusic-Android-Alpha2-Source.zip . \
            -x "KodaMusic-Android-Alpha2-Source.zip" \
            -x ".gradle/*" \
            -x "**/build/*" \
            -x "local.properties"

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: KodaMusic-Android-Alpha2-Source
          path: KodaMusic-Android-Alpha2-Source.zip
          if-no-files-found: error
