name: Koda Cut v0.3 CI

on:
  push:
    branches:
      - kodacut-v0.3-source
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile Java sources
        shell: cmd
        run: |
          if not exist out mkdir out
          javac -encoding UTF-8 --release 17 -d out src\kodacut\*.java

      - name: Generate official icon
        shell: cmd
        run: |
          if not exist assets mkdir assets
          java -cp out kodacut.IconMaker assets\koda-cut-icon.png assets\koda-cut.ico
          if not exist assets\koda-cut-icon.png exit /b 1
          if not exist assets\koda-cut.ico exit /b 1

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $($_.Name)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              $failed = $true
            } else {
              Write-Host "OK $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Build jar
        shell: cmd
        run: |
          if not exist build mkdir build
          jar --create --file build\KodaCut.jar -C out .

      - name: Validate portable app image
        shell: cmd
        run: |
          jpackage --type app-image --dest ci-dist --name "Koda Cut CI" --input build --main-jar KodaCut.jar --main-class kodacut.KodaCut --vendor "Koda" --app-version 0.3 --icon assets\koda-cut.ico
          if not exist "ci-dist\Koda Cut CI\Koda Cut CI.exe" exit /b 1


      - name: Verify Koda Cut v0.3 files
        shell: pwsh
        run: |
          $required = @(
            "scripts/editor.ps1",
            "scripts/configurar.ps1",
            "scripts/transcrever.ps1",
            "scripts/importar-youtube.ps1",
            "scripts/cortes.ps1",
            "assets/koda-cut-icon.svg",
            "assets/koda-cut-logo.svg"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing required file: $file" }
          }
          Write-Host "Koda Cut v0.3 source set OK"


  runtime-smoke:
    if: contains(github.event.head_commit.message, '[runtime-smoke]') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure free local tools
        shell: powershell
        run: |
          .\scripts\configurar.ps1

      - name: Create spoken test video
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Speech
          $speech = Join-Path $PWD "runtime-speech.wav"
          $synth = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $synth.SetOutputToWaveFile($speech)
          $synth.Speak("Koda Cut automatic transcription test. The local video editor is processing this sentence correctly. This is a free offline speech test.")
          $synth.Dispose()
          & .\ffmpeg\bin\ffmpeg.exe -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=1280x720:rate=30" -i $speech -shortest -c:v libx264 -preset ultrafast -c:a aac runtime-test.mp4
          if ($LASTEXITCODE -ne 0) { throw "Could not create runtime test video" }

      - name: Test local Whisper transcription
        shell: powershell
        run: |
          .\scripts\transcrever.ps1 -Video "$PWD\runtime-test.mp4" -Language en -OutputDir "$PWD\transcricoes"
          $srt = Get-ChildItem .\transcricoes -Filter *.srt | Select-Object -First 1
          if (-not $srt) { throw "Whisper did not create SRT" }
          Write-Host "Whisper SRT: $($srt.FullName)"

      - name: Create smoke KodaScript
        shell: powershell
        run: |
          $project = @{
            version = 3
            fps = 30
            duracao_saida = 3
            musica = @{ asset = ""; volume = 0.08 }
            timeline = @(
              @{
                inicio = 0.5
                fim = 1.5
                texto = "KODA CUT"
                texto_posicao = "top"
                zoom = 1.08
                shake = 3
                freeze = $false
              }
            )
          }
          $project | ConvertTo-Json -Depth 10 | Set-Content runtime-project.json -Encoding UTF8
          $manifest = @{
            "video:principal" = @{
              type = "video"
              path = (Resolve-Path .\runtime-test.mp4).Path
              name = "runtime-test.mp4"
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content runtime-assets.json -Encoding UTF8

      - name: Smoke render horizontal vertical and square
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force runtime-output | Out-Null
          .\scripts\editor.ps1 -Video "$PWD\runtime-test.mp4" -Project "$PWD\runtime-project.json" -Manifest "$PWD\runtime-assets.json" -OutputMode todos -VerticalMode blur -Quality eco -OutputDir "$PWD\runtime-output" -CaptionMode completa -AutoTranscribe true -Language en -SafeZone true -NoiseReduction true -NormalizeAudio true -Ducking true -VoiceVolume 1.0 -DefaultMusicVolume 0.08 -Style clean
          if ($LASTEXITCODE -ne 0) { throw "Koda Cut runtime render failed" }
          $videos = @(Get-ChildItem .\runtime-output -Filter *.mp4)
          if ($videos.Count -ne 3) { throw "Expected 3 rendered videos, found $($videos.Count)" }
          $videos | ForEach-Object { Write-Host "OK $($_.Name) $($_.Length) bytes" }
